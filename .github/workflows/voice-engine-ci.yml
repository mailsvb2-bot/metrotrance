name: Voice Engine CI

on:
  push:
    branches:
      - main
      - feature/natural-voice-engine-v04
  pull_request:
    branches:
      - main


defaults:
  run:
    shell: bash

jobs:
  natural-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q --upgrade pip
      - run: python -m pip install -q -e ".[test]"
      - run: python -m compileall -q metrotrance tests
      - name: Natural voice and audio joins
        run: |
          set +e
          python -m pytest -q --tb=short tests/test_natural_voice.py tests/test_natural_join.py tests/test_audio.py > pytest.log 2>&1
          status=$?
          tail -n 100 pytest.log
          exit $status

  provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - name: Qwen and Chatterbox contracts
        run: |
          set +e
          python -m pytest -q --tb=short tests/test_qwen_provider.py tests/test_chatterbox_compatibility.py tests/test_provider_priority.py tests/test_voice_test_job.py > pytest.log 2>&1
          status=$?
          tail -n 100 pytest.log
          exit $status

  studio-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - name: Private corpus fallbacks and performance plan
        run: |
          set +e
          python -m pytest -q --tb=short tests/test_style_corpus.py tests/test_studio_profile.py tests/test_performance_director.py tests/test_studio_audio_mix.py > pytest.log 2>&1
          status=$?
          tail -n 100 pytest.log
          exit $status

  remaining-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - name: Remaining regression suite
        run: |
          set +e
          python -m pytest -q --tb=short \
            --ignore=tests/test_natural_voice.py \
            --ignore=tests/test_natural_join.py \
            --ignore=tests/test_audio.py \
            --ignore=tests/test_qwen_provider.py \
            --ignore=tests/test_chatterbox_compatibility.py \
            --ignore=tests/test_provider_priority.py \
            --ignore=tests/test_voice_test_job.py \
            --ignore=tests/test_style_corpus.py \
            --ignore=tests/test_studio_profile.py \
            --ignore=tests/test_performance_director.py \
            --ignore=tests/test_studio_audio_mix.py > pytest.log 2>&1
          status=$?
          tail -n 100 pytest.log
          exit $status
