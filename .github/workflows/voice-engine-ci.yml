name: Voice Engine CI

on:
  push:
    branches:
      - main
      - feature/natural-voice-engine-v04
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q metrotrance tests

      - name: Run full test suite
        run: python -m pytest -q
