name: Voice Engine CI

on:
  push:
    branches:
      - main
      - feature/natural-voice-engine-v04
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # BEGIN ONE-SHOT FIX
  apply-requested-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-wave-extensible-installer-version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply targeted fixes and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          voice_path = root / "metrotrance/services/voice_quality.py"
          voice = voice_path.read_text(encoding="utf-8")
          old_voice = '''def _read_pcm16_compatible(path: Path) -> tuple[int, int, int, int, bytes]:
              """Read normal PCM WAV and WAVE_FORMAT_EXTENSIBLE through one safe path."""
              try:
                  return _read_native_pcm16(path)
              except (wave.Error, EOFError) as exc:
                  with tempfile.TemporaryDirectory(prefix="metrotrance-voice-quality-") as temp_dir:
                      normalized = Path(temp_dir) / "normalized.wav"
                      try:
                          normalize_wav_pcm16(path, normalized)
                          return _read_native_pcm16(normalized)
                      except Exception as normalize_exc:  # noqa: BLE001
                          raise ValueError(f"Не удалось декодировать WAV для анализа: {normalize_exc}") from exc
          '''
          new_voice = '''def _read_pcm16_compatible(path: Path) -> tuple[int, int, int, int, bytes]:
              """Read WAV input and normalize every non-PCM16 stream before analysis."""
              native_error: Exception | None = None
              try:
                  native = _read_native_pcm16(path)
                  if native[1] == 2:
                      return native
              except (wave.Error, EOFError) as exc:
                  native_error = exc

              with tempfile.TemporaryDirectory(prefix="metrotrance-voice-quality-") as temp_dir:
                  normalized = Path(temp_dir) / "normalized.wav"
                  try:
                      normalize_wav_pcm16(path, normalized)
                      compatible = _read_native_pcm16(normalized)
                      if compatible[1] != 2:
                          raise ValueError("Нормализация WAV не создала PCM16 поток")
                      return compatible
                  except Exception as normalize_exc:  # noqa: BLE001
                      cause = native_error or normalize_exc
                      raise ValueError(f"Не удалось декодировать WAV для анализа: {normalize_exc}") from cause
          '''
          if voice.count(old_voice) != 1:
              raise SystemExit("voice_quality.py target block was not found exactly once")
          voice_path.write_text(voice.replace(old_voice, new_voice), encoding="utf-8")

          installer_path = root / "windows_installer.py"
          installer = installer_path.read_text(encoding="utf-8")
          installer = installer.replace(
              "from pathlib import Path\n\nVERSION = \"0.3.1\"",
              "from pathlib import Path\n\nfrom metrotrance import __version__\n\nVERSION = __version__",
              1,
          )
          if 'VERSION = "0.3.1"' in installer or "VERSION = __version__" not in installer:
              raise SystemExit("windows_installer.py version replacement failed")
          installer_path.write_text(installer, encoding="utf-8")

          test_path = root / "tests/test_voice_quality.py"
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from metrotrance.config import get_settings\n",
              "from metrotrance.config import get_settings\nfrom metrotrance.services import voice_quality\n",
              1,
          )
          regression_test = '''\n\ndef test_pcm16_compatibility_normalizes_by_actual_sample_width(tmp_path: Path, monkeypatch) -> None:
              source = tmp_path / "source.wav"
              source.write_bytes(b"source")
              normalized_result = (1, 2, 24000, 1, b"\\x00\\x00")
              reads: list[Path] = []

              def fake_read(path: Path) -> tuple[int, int, int, int, bytes]:
                  current = Path(path)
                  reads.append(current)
                  if current == source:
                      return (2, 3, 24000, 1, b"\\x00" * 6)
                  assert current.name == "normalized.wav"
                  return normalized_result

              def fake_normalize(source_path: Path, destination: Path) -> None:
                  assert source_path == source
                  destination.write_bytes(b"normalized")

              monkeypatch.setattr(voice_quality, "_read_native_pcm16", fake_read)
              monkeypatch.setattr(voice_quality, "normalize_wav_pcm16", fake_normalize)

              assert voice_quality._read_pcm16_compatible(source) == normalized_result
              assert len(reads) == 2
          '''
          marker = "\n\ndef test_voice_quality_accepts_wave_format_extensible(tmp_path: Path) -> None:\n"
          if marker not in tests:
              raise SystemExit("test_voice_quality.py insertion marker not found")
          tests = tests.replace(marker, regression_test + marker, 1)
          test_path.write_text(tests, encoding="utf-8")

          version_test = root / "tests/test_release_version_sync.py"
          version_test.write_text(
              '''from __future__ import annotations

import json
import tomllib
from pathlib import Path

import windows_installer
from metrotrance import __version__


ROOT = Path(__file__).resolve().parents[1]


def test_release_version_is_synchronized() -> None:
    with (ROOT / "pyproject.toml").open("rb") as stream:
        project_version = tomllib.load(stream)["project"]["version"]
    manifest_version = json.loads(
        (ROOT / "bundle_manifest.json").read_text(encoding="utf-8")
    )["version"]
    readme = (ROOT / "README.md").read_text(encoding="utf-8")

    assert windows_installer.VERSION == __version__
    assert project_version == __version__
    assert manifest_version == __version__
    assert f"MetroTrance {__version__}" in readme
''',
              encoding="utf-8",
          )

          manifest_path = root / "bundle_manifest.json"
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest = manifest.replace(
              '    "tests/test_voice_quality.py",\n',
              '    "tests/test_release_version_sync.py",\n    "tests/test_voice_quality.py",\n',
              1,
          )
          manifest_path.write_text(manifest, encoding="utf-8")

          ci_path = root / ".github/workflows/voice-engine-ci.yml"
          ci = ci_path.read_text(encoding="utf-8")
          begin = "  # BEGIN ONE-SHOT FIX\n"
          end = "  # END ONE-SHOT FIX\n"
          start_index = ci.index(begin)
          end_index = ci.index(end, start_index) + len(end)
          ci = ci[:start_index] + ci[end_index:]
          ci = ci.replace("  contents: write\n", "  contents: read\n", 1)
          ci = ci.replace(
              "            files: tests/test_windows_launchers.py\n",
              "            files: tests/test_release_version_sync.py tests/test_windows_launchers.py\n",
              1,
          )
          matrix_expression = "$" + "{{ matrix.python-version }}"
          compatibility_job = f'''\n  python-compatibility:
    name: python-{matrix_expression}-compatibility
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: {matrix_expression}
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - run: python -m pytest -q --tb=short tests/test_voice_quality.py tests/test_release_version_sync.py
'''
          ci = ci.rstrip() + "\n" + compatibility_job
          ci_path.write_text(ci, encoding="utf-8")
          PY

      - name: Validate patched files
        run: |
          python -m compileall -q metrotrance tests windows_installer.py
          python -m pip install -q -e ".[test]"
          python -m pytest -q --tb=short tests/test_voice_quality.py tests/test_release_version_sync.py tests/test_windows_launchers.py

      - name: Commit fixes
        run: |
          git config user.name "metrotrance-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-requested-fixes.yml
          git add metrotrance/services/voice_quality.py windows_installer.py tests/test_voice_quality.py tests/test_release_version_sync.py bundle_manifest.json .github/workflows/voice-engine-ci.yml
          git commit -m "Fix Python 3.12 WAV handling and installer version"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
  # END ONE-SHOT FIX

  natural-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q --upgrade pip
      - run: python -m pip install -q -e ".[test]"
      - run: python -m compileall -q metrotrance tests
      - run: python -m pytest -q --tb=short tests/test_natural_voice.py tests/test_natural_join.py tests/test_audio.py

  provider-contract:
    name: provider-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen
            file: tests/test_qwen_provider.py
          - name: chatterbox
            file: tests/test_chatterbox_compatibility.py
          - name: priority
            file: tests/test_provider_priority.py
          - name: voice-test-job
            file: tests/test_voice_test_job.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - name: Run provider contract
        run: |
          set +e
          python -m pytest -q --tb=long "${{ matrix.file }}" > "pytest-${{ matrix.name }}.log" 2>&1
          status=$?
          cat "pytest-${{ matrix.name }}.log"
          exit $status
      - name: Upload provider diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-provider-${{ matrix.name }}
          path: pytest-${{ matrix.name }}.log
          if-no-files-found: error
      - name: Post provider failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: provider-${{ matrix.name }}"
            echo
            echo '```text'
            cat "pytest-${{ matrix.name }}.log"
            echo '```'
          } > diagnostic.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostic.md

  studio-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - run: python -m pytest -q --tb=short tests/test_style_corpus.py tests/test_studio_profile.py tests/test_performance_director.py tests/test_studio_audio_mix.py

  regression-contour:
    name: regression-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: domain
            files: >-
              tests/test_ambient.py tests/test_chunker.py tests/test_models.py
              tests/test_pacing.py tests/test_safety.py tests/test_script_writer.py
              tests/test_text_import.py
          - name: ui
            files: >-
              tests/test_dialog_close_ui.py tests/test_manual_stress_editor_ui.py
              tests/test_sound_library_ui.py tests/test_stress_preview_ui.py
              tests/test_voice_lab_ui.py
          - name: assets-scenes
            files: >-
              tests/test_audio_assets.py tests/test_audio_assets_api.py
              tests/test_scene_audio_engine.py tests/test_scene_renderer.py
          - name: voice-state
            files: >-
              tests/test_voice_approval_gate.py tests/test_voice_profile.py
              tests/test_voice_quality.py
          - name: local-llama
            files: tests/test_local_llama.py
          - name: pronunciation
            files: tests/test_pronunciation.py
          - name: windows-launchers
            files: tests/test_windows_launchers.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - name: Run regression contour
        run: |
          set +e
          python -m pytest -q --tb=long ${{ matrix.files }} > "pytest-${{ matrix.name }}.log" 2>&1
          status=$?
          cat "pytest-${{ matrix.name }}.log"
          exit $status
      - name: Upload regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-regression-${{ matrix.name }}
          path: pytest-regression-${{ matrix.name }}.log
          if-no-files-found: error
      - name: Post regression failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: regression-${{ matrix.name }}"
            echo
            echo '```text'
            cat "pytest-${{ matrix.name }}.log"
            echo '```'
          } > diagnostic.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostic.md
