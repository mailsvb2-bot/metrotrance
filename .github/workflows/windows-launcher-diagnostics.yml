name: Windows Launcher Diagnostics

on:
  push:
    branches:
      - feature/natural-voice-engine-v04
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer-contract:
    name: windows-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: short-runtime-paths
            test: tests/test_windows_launchers.py::test_windows_installer_uses_short_runtime_paths
          - name: embedded-requirements
            test: tests/test_windows_launchers.py::test_windows_installer_does_not_require_requirements_text_files
          - name: source-preflight
            test: tests/test_windows_launchers.py::test_windows_installer_has_source_bundle_preflight
          - name: public-manifest
            test: tests/test_windows_launchers.py::test_bundle_manifest_points_to_existing_public_files
          - name: validate-source-bundle
            test: tests/test_windows_launchers.py::test_validate_source_bundle_passes_for_public_tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -e ".[test]"
      - run: python -m pytest -q --tb=short ${{ matrix.test }}
